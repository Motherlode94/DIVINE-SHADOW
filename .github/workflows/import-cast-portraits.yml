name: Import cast photographic portraits
on:
  push:
    paths:
      - '.github/workflows/import-cast-portraits.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow==11.3.0
      - name: Download photographic assets
        shell: bash
        run: |
          python - <<'PY'
          import urllib.request
          from pathlib import Path
          from io import BytesIO
          from PIL import Image
          url="https://media.canva.com/v2/image-resize/format:PNG/height:200/quality:100/uri:ifs%3A%2F%2FM%2Fa4a6b441-e985-4321-bbd7-65b87c68acad/watermark:F/width:150?csig=AAAAAAAAAAAAAAAAAAAAAIyglQTLf5rugATKnZ6zXPx96Xa2c7UEHbvRbgLhCKyt&exp=1793991564&osig=AAAAAAAAAAAAAAAAAAAAACOM-TRGQ99cwlNo62XeeMlg4dVCG72OLlEAPv8paBfE&signer=media-rpc&token=AAIAAU0AJGE0YTZiNDQxLWU5ODUtNDMyMS1iYmQ3LTY1Yjg3YzY4YWNhZAAAAAABobI62uDk7w69SCRTe8iinloAcNJQibTp-xcR4S5MQIX-tuDu5g&x-canva-quality=thumbnail"
          r=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0"})
          with urllib.request.urlopen(r,timeout=50) as response: photo=response.read()
          im=Image.open(BytesIO(photo)).convert("RGB")
          assert im.width>=145, im.size
          p=Path("assets/cast/isha.webp");p.parent.mkdir(parents=True,exist_ok=True)
          im.save(p,format="WEBP",quality=94,method=6)
          print("Saved",p,im.size)
          
          PY
      - name: Commit portrait assets
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/cast/*.webp
          if ! git diff --cached --quiet; then
            git commit -m 'assets(cast): import cinematic face portraits'
            git push
          fi
