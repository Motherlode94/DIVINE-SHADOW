          folder=Path("assets/cast");folder.mkdir(parents=True,exist_ok=True)
          for identity,url in sources.items():
            destination=folder/(identity+".webp")
            try:
              request=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0"})
              for attempt in range(3):
                try:
                  with urllib.request.urlopen(request,timeout=45) as response: body=response.read()
                  break
                except Exception:
                  if attempt==2: raise
                  time.sleep(3)
              im=Image.open(BytesIO(body)).convert("RGB")
              assert im.width>=145 and im.height>=190,(identity,im.size)
              im.save(destination,format="WEBP",quality=94,method=6)
              print(identity,im.size,destination.stat().st_size)
            except Exception as e:
              print("FAILED",identity,str(e),flush=True)
              raise
          
          PY
      - name: Commit imported photos
        shell: bash
        run: |
