uri:ifs%3A%2F%2FM%2F09129dff-69d0-4ab1-be5a-70581bf439f3/watermark:F/width:199?csig=AAAAAAAAAAAAAAAAAAAAAOijqdJXrGOIGZ8A7afOMD4pmXB9H3OUYDmcbJYfylUd&exp=1793991653&osig=AAAAAAAAAAAAAAAAAAAAAGt_6vx0XCLDwHzxJVaXglrxeegvQXCjZwA-rmNcbH-d&signer=media-rpc&token=AAIAAU0AJDA5MTI5ZGZmLTY5ZDAtNGFiMS1iZTVhLTcwNTgxYmY0MzlmMwAAAAABobI8NohiEZ-bLsrXwVlC7ta6sOfJM7qkg5bfY4ZmRcTJX40qcw&x-canva-quality=thumbnail","portrait-09":"https://media.canva.com/v2/image-resize/format:JPG/height:200/quality:75/uri:ifs%3A%2F%2FM%2F159b7ba4-8e80-4b46-bea7-41db9a043fdf/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAAGF9bNfCBDehwcH_S3q8Hali6SPJGt9OUjxDAjfovCHU&exp=1793991515&osig=AAAAAAAAAAAAAAAAAAAAACQhFvgxy1Oraso0bDnBExFht-GpM6Jx-SIxxh9tPoBm&signer=media-rpc&token=AAIAAU0AJDE1OWI3YmE0LThlODAtNGI0Ni1iZWE3LTQxZGI5YTA0M2ZkZgAAAAABobI6G3gXsjYV6SVW45jlz41yghumttAyYyeEKg0cVsNCuwR40Q&x-canva-quality=thumbnail","portrait-10":"https://media.canva.com/v2/image-resize/format:JPG/height:178/quality:75/uri:ifs%3A%2F%2FM%2Fd80ea6cf-0924-4d27-9b83-3328417584cc/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAAKdA2UbD5PwqpsH8vBTO4sLXmuDXkhebjgVgEYe96cUe&exp=1793991452&osig=AAAAAAAAAAAAAAAAAAAAAJvEH8Fzl-irYYECOZUIAnQt_mX6xrELowqs5AVXa_Ax&signer=media-rpc&token=AAIAAU0AJGQ4MGVhNmNmLTA5MjQtNGQyNy05YjgzLTMzMjg0MTc1ODRjYwAAAAABobI5JWCUoegXHDrdXGAyde2F1BWkxfgA-2lk39uyNA9Tg8X0Ig&x-canva-quality=thumbnail","portrait-11":"https://media.canva.com/v2/image-resize/format:JPG/height:180/quality:75/uri:ifs%3A%2F%2FM%2Fd00180bc-ba66-46b8-ae72-7b5404f2c516/watermark:F/width:189?csig=AAAAAAAAAAAAAAAAAAAAAOJxQ6i_eOVHbXC-YVn4daFQWy6T2CapEOGIbH3Mp0l_&exp=1793992618&osig=AAAAAAAAAAAAAAAAAAAAAFRy6-PI6EbBiAoYqDMDxJ30dfpZgT0H60UFkKLoEKAh&signer=media-rpc&token=AAIAAU0AJGQwMDE4MGJjLWJhNjYtNDZiOC1hZTcyLTdiNTQwNGYyYzUxNgAAAAABobJK8BAfWznPK8pNe2ryOMZtdByR_caaKI8sTXbFv2q0pHUZwg&x-canva-quality=thumbnail"}
          folder=Path("assets/population/new")
          folder.mkdir(parents=True,exist_ok=True)
          for slug,url in urls.items():
              req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0"})
              body=None
              for attempt in range(4):
                  try:
                      with urllib.request.urlopen(req,timeout=45) as response:
                          body=response.read()
                          break
                  except Exception as e:
                      if attempt==3:raise
                      time.sleep(2)
              image=Image.open(BytesIO(body)).convert("RGB")
              assert image.width>=145 and image.height>=130,(slug,image.size)
              output=folder/(slug+".webp")
              image.save(output,"WEBP",quality=93,method=6)
              print(slug,image.size,output.stat().st_size)
          assert len(list(folder.glob("portrait-*.webp")))==12
          
          PY
      - name: Publish new resident portraits
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/population/new/portrait-*.webp
          if ! git diff --cached --quiet; then
            git commit -m 'assets(population): replace first 12 blurry faces with new portrait photography'
            git push
          fi
