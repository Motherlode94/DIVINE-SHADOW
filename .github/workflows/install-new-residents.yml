name: Install new cinematic residents
on:
  push:
    paths:
      - '.github/workflows/install-new-residents.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow==11.3.0
      - name: Import newly generated portraits
        shell: bash
        run: |
          python - <<'PY'
          import urllib.request
          from pathlib import Path
          from io import BytesIO
          from PIL import Image,ImageEnhance
          import time
          urls={"portrait-00":"https://media.canva.com/v2/image-resize/format:JPG/height:199/quality:75/uri:ifs%3A%2F%2FM%2F25981a01-bb12-4392-b2ec-2a44b53ffc19/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAAOGUOg45exnslGxJlg6zHnJo57sHV7uf7iz4w24nqtbS&exp=1793992490&osig=AAAAAAAAAAAAAAAAAAAAAM4nml8uT6eU-BUMkXSfbqGAEOFFyQQOKxkqfAsfpwUa&signer=media-rpc&token=AAIAAU0AJDI1OTgxYTAxLWJiMTItNDM5Mi1iMmVjLTJhNDRiNTNmZmMxOQAAAAABobJI_BDB1V3fR41v3V_nU1K-u839cfoNj6ZI0PUuvAh6Be2aWg&x-canva-quality=thumbnail","portrait-01":"https://media.canva.com/v2/image-resize/format:JPG/height:200/quality:75/uri:ifs%3A%2F%2FM%2F0c85d213-5923-4177-a3f3-170a7a682c6a/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAANcPUIpCWzHfOesXEk1-6LOIuNPtfgYQDaoNRkyj8IJC&exp=1793990972&osig=AAAAAAAAAAAAAAAAAAAAAD9KYt9tu7tGlfN2mrHqwoG2t9SJYkydIVEf8DWvUbSA&signer=media-rpc&token=AAIAAU0AJDBjODVkMjEzLTU5MjMtNDE3Ny1hM2YzLTE3MGE3YTY4MmM2YQAAAAABobIx0mApkRF0EWh1qhnGxUy-tKrE6sUB-wvrxXJE3TpOH31ybg&x-canva-quality=thumbnail","portrait-02":"https://media.canva.com/v2/image-resize/format:JPG/height:199/quality:75/uri:ifs%3A%2F%2FM%2Fa89d9e54-912e-4c77-9264-845b6bfb58c6/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAAMxHhfds7rIdvELb4P-tqLgy9HhquljxMGJZw7xqsOX8&exp=1793994111&osig=AAAAAAAAAAAAAAAAAAAAAAwWlnpLGkSALBPxKRMtvR0MqanFDJqzgyTboDypW4Jd&signer=media-rpc&token=AAIAAU0AJGE4OWQ5ZTU0LTkxMmUtNGM3Ny05MjY0LTg0NWI2YmZiNThjNgAAAAABobJhuBhGPGMpnWP08yUVBdU49Lr-TxnxTV-rrm6QEBzGIi21vA&x-canva-quality=thumbnail","portrait-03":"https://media.canva.com/v2/image-resize/format:JPG/height:200/quality:75/uri:ifs%3A%2F%2FM%2F60fe5c57-968c-44aa-9608-d82b19dbce12/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAAHYluFqWXtco-La0UFe2GhIRH9WYkDeWo4NTdZCveswA&exp=1793994133&osig=AAAAAAAAAAAAAAAAAAAAAKKzIg-5FymFjNw-0kwv9qxYXqkdSpRCXipwa2_9GZIA&signer=media-rpc&token=AAIAAU0AJDYwZmU1YzU3LTk2OGMtNDRhYS05NjA4LWQ4MmIxOWRiY2UxMgAAAAABobJiDgjfHwr84r5o5SMHTOdPSMyhY9m-pL4Qx1QcCE8jctoOvw&x-canva-quality=thumbnail","portrait-04":"https://media.canva.c