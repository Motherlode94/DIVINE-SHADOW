name: Correct character identity portraits
on:
  push:
    paths:
      - '.github/workflows/refine-resident-identities.yml'
      - 'scripts/refine-resident-identities.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refine:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow==11.3.0
      - run: python scripts/refine-resident-identities.py
      - name: Commit reviewable candidate images
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/population/candidates/portrait-*.webp
          if ! git diff --cached --quiet; then
            git commit -m 'assets(population): more faithful portraits for six named characters'
            git pull --rebase origin main
            git push
          fi
