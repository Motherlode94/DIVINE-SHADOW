name: Restore blurry cinematic character cards
on:
  push:
    paths:
      - '.github/workflows/restore-cast-portraits.yml'
      - 'scripts/restore-cast-portraits.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU super-resolution dependencies
        run: python -m pip install --quiet 'numpy<2' 'opencv-contrib-python-headless==4.10.0.84' 'Pillow==11.3.0'
      - name: Reconstruct display-scale portraits separately
        run: python scripts/restore-cast-portraits.py
      - name: Commit checked upgraded portraits
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/cast/hd/*.webp
          if ! git diff --cached --quiet; then
            git commit -m 'assets(cast): 17 separate 4x super-resolution character portraits'
            git push
          fi
