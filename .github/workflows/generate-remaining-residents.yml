name: Generate original remaining residents
on:
  push:
    paths:
      - '.github/workflows/generate-remaining-residents.yml'
      - 'scripts/generate-remaining-residents.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  original-photos:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow==11.3.0
      - name: Generate individual portraits without reusing faces
        run: python scripts/generate-remaining-residents.py
      - name: Commit each completed unique image
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/population/new/portrait-*.webp
          if ! git diff --cached --quiet; then
            git commit -m 'assets(population): uniquely generated portraits for remaining 28 residents'
            git pull --rebase origin main
            git push
          fi
