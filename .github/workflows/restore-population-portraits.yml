name: Improve individual civilian faces
on:
  push:
    paths:
      - 'scripts/restore-population-portraits.py'
      - '.github/workflows/restore-population-portraits.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  enhance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet 'numpy<2' 'opencv-contrib-python-headless==4.10.0.84' 'Pillow==11.3.0'
      - name: Extract and reconstruct forty distinct resident portraits
        run: python scripts/restore-population-portraits.py
      - name: Commit resident photographs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/population/hd/
          if ! git diff --cached --quiet; then
            git commit -m 'assets(population): forty individually indexed reconstructed resident portraits'
            git push
          fi
