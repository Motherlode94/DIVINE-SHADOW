name: Clean antagonist portraits
on:
  push:
    paths:
      - '.github/workflows/clean-antagonist-portraits.yml'
      - 'scripts/clean-antagonist-portraits.py'
      - 'assets/vaelkor_portrait.png'
      - 'assets/nyssara_portrait.png'
      - 'assets/orvann_portrait.png'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  crop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow==11.3.0
      - run: python scripts/clean-antagonist-portraits.py
      - name: Commit clean assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/vaelkor_clean.png assets/nyssara_clean.png assets/orvann_clean.png
          if ! git diff --cached --quiet; then
            git commit -m "Generate clean villain artwork with consistent crop"
            git push
          fi
